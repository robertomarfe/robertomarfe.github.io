name: Restore recovered original site

on:
  push:
    paths:
      - '.github/workflows/deploy-recovered-original.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore original website files
        shell: bash
        run: |
          set -euo pipefail

          cp legacy-original/index.html index.html
          cp legacy-original/research01.html research01.html
          cp legacy-original/research02.html research02.html
          cp legacy-original/teaching.html teaching.html
          cp legacy-original/master.html master.html
          cp legacy-original/events.html events.html
          cp legacy-original/professional.html professional.html

          mkdir -p teaching APConference cv pictures papers Mafirm/slides Mafirm/audio
          cp legacy-original/teaching/teaching.html teaching/teaching.html
          cp legacy-original/APConference/apconference.htm APConference/apconference.htm
          cp legacy-original/cv/ROBERTO_MARFE_CV.pdf cv/ROBERTO_MARFE_CV.pdf
          cp legacy-original/pictures/marfe_cca_02.jpg pictures/marfe_cca_02.jpg
          cp legacy-original/Mafirm/slideshow.html Mafirm/slideshow.html
          cp legacy-original/Mafirm/slides/slide_*.png Mafirm/slides/
          cp legacy-original/Mafirm/audio/MAFIRM_12m.mp3 Mafirm/audio/MAFIRM_12m.mp3
          cp legacy-original/DES_002.pdf DES_002.pdf
          cp legacy-original/HKM3_MS3.pdf HKM3_MS3.pdf
          cp legacy-original/HaslerKhapkoMarfe_OLD.pdf HaslerKhapkoMarfe_OLD.pdf
          cp legacy-original/papers/*.pdf papers/

          for f in index.html research01.html research02.html teaching.html master.html events.html professional.html teaching/teaching.html APConference/apconference.htm Mafirm/slideshow.html; do
            sed -i 's#http://robertomarfe\.altervista\.org/#/#g' "$f"
            sed -i 's#http://www\.robertomarfe\.altervista\.org/#/#g' "$f"
          done

          touch .nojekyll

      - name: Verify fidelity-critical features
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Bookman Old Style' index.html
          grep -q 'pictures/marfe_cca_02.jpg' index.html
          grep -q '<details>' research01.html
          grep -q '<details>' research02.html
          grep -q 'Mafirm/slides/slide_01.png' master.html
          test -f pictures/marfe_cca_02.jpg
          test -f cv/ROBERTO_MARFE_CV.pdf
          for n in $(seq -w 1 13); do test -f "Mafirm/slides/slide_${n}.png"; done
          if grep -RInF 'http://robertomarfe.altervista.org/' -- *.html teaching APConference Mafirm 2>/dev/null; then
            echo 'Found obsolete internal HTTP references.'
            exit 1
          fi

      - name: Commit restored original site
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html research01.html research02.html teaching.html master.html events.html professional.html \
            teaching/teaching.html APConference/apconference.htm cv/ROBERTO_MARFE_CV.pdf pictures \
            Mafirm DES_002.pdf HKM3_MS3.pdf HaslerKhapkoMarfe_OLD.pdf papers .nojekyll
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Restore original Altervista website faithfully'
            git push
          fi
