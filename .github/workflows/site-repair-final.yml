name: Final site repair pass
on:
  push:
    paths: ['.github/workflows/site-repair-final.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair public site
        shell: bash
        run: |
          set -euo pipefail
          cat > favicon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
            <rect width="64" height="64" rx="12" fill="#003366"/>
            <text x="32" y="41" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#fff">RM</text>
          </svg>
          SVG
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          files=[p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.html','.htm'} and 'legacy-original' not in p.parts and '.git' not in p.parts]
          icon='<link rel="icon" href="/favicon.svg" type="image/svg+xml">'
          viewport='<meta name="viewport" content="width=device-width, initial-scale=1">'
          for p in files:
              s=p.read_text(encoding='utf-8',errors='replace')
              if 'name="viewport"' not in s.lower():
                  m=re.search(r'(<meta[^>]+charset[^>]*>)',s,re.I)
                  if m: s=s[:m.end()]+'\n'+viewport+s[m.end():]
                  else: s=re.sub(r'(<head[^>]*>)',r'\1\n'+viewport,s,count=1,flags=re.I)
              s=re.sub(r'\s*<link[^>]+rel=["\'][^"\']*(?:shortcut\s+icon|icon)[^"\']*["\'][^>]*>','',s,flags=re.I)
              s=re.sub(r'(</title>)',r'\1\n  '+icon,s,count=1,flags=re.I)
              def secure(m):
                  tag=m.group(0)
                  return tag if re.search(r'\brel\s*=',tag,re.I) else tag[:-1]+' rel="noopener noreferrer">'
              s=re.sub(r'<a\b[^>]*\btarget=["\']_blank["\'][^>]*>',secure,s,flags=re.I)
              p.write_text(s,encoding='utf-8')

          p=Path('professional.html'); s=p.read_text(); s=s.replace('<h1>Professional Engagement and Consulting</h2>','<h1>Professional Engagement and Consulting</h1>'); p.write_text(s)
          p=Path('master.html'); s=p.read_text(); s=s.replace('<!-- text-decoration: underline; -->','/* text-decoration: underline; */'); p.write_text(s)
          p=Path('Mafirm/slideshow.html'); s=p.read_text(); s=s.replace('href="http://robertomarfe.altervista.org"','href="/"')
          for n in range(2,14): s=s.replace(f'id="slide{n}" class="slide active"',f'id="slide{n}" class="slide"')
          p.write_text(s)
          p=Path('research02.html'); s=p.read_text(); s=re.sub(r'\s*<p><a href="">Download PDF</a></p>','',s); p.write_text(s)
          p=Path('events.html'); s=p.read_text(); s=s.replace('<a href="#">[]</a>',''); p.write_text(s)

          p=Path('APConference/apconference.htm'); s=p.read_text()
          s=s.replace('  window.open(apri,"","width=" + w + ",height=" + h + ",top=" + t + ",left=" + l);\n}\n}\n</script>','  window.open(apri,"","width=" + w + ",height=" + h + ",top=" + t + ",left=" + l);\n}\n</script>')
          s=re.sub(r'<script type="text/javascript">\s*var _gaq.*?</script>','',s,flags=re.S)
          p.write_text(s)

          p=Path('teaching/teaching.html'); s=p.read_text(encoding='utf-8',errors='replace')
          s=re.sub(r'<script type="text/javascript">\s*var _gaq.*?</script>','',s,flags=re.S)
          s=re.sub(r'<script language="JavaScript">\s*function Email\(\).*?</script>','',s,flags=re.S)
          s=re.sub(r'<script>\s*function scrivi\(\).*?</script>','',s,flags=re.S)
          broken_local=(r'(?:/teaching/assetpricing2020/(?:fineco|aap)/|/teaching/econometrics201[345]/(?:syllabus_econometrics\.pdf)?|ficr20(?:09|10|11|12)20(?:10|11|12|13)/)')
          s=re.sub(r'<a\b[^>]*href=["\']'+broken_local+r'["\'][^>]*>(.*?)</a>',r'\1',s,flags=re.I|re.S)
          s=re.sub(r'<a\b[^>]*href=["\']http://[^"\']+["\'][^>]*>(.*?)</a>',r'\1',s,flags=re.I|re.S)
          p.write_text(s,encoding='utf-8')
          PY
          rm -rf assets
          rm -f cv/index.html
          cat > sitemap.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url><loc>https://robertomarfe.github.io/</loc></url>
            <url><loc>https://robertomarfe.github.io/research01.html</loc></url>
            <url><loc>https://robertomarfe.github.io/research02.html</loc></url>
            <url><loc>https://robertomarfe.github.io/teaching.html</loc></url>
            <url><loc>https://robertomarfe.github.io/master.html</loc></url>
            <url><loc>https://robertomarfe.github.io/events.html</loc></url>
            <url><loc>https://robertomarfe.github.io/professional.html</loc></url>
            <url><loc>https://robertomarfe.github.io/Mafirm/slideshow.html</loc></url>
            <url><loc>https://robertomarfe.github.io/teaching/teaching.html</loc></url>
            <url><loc>https://robertomarfe.github.io/APConference/apconference.htm</loc></url>
          </urlset>
          XML
          cat > 404.html <<'HTML'
          <!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Page not found - Roberto Marfè</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><style>body{font-family:"Bookman Old Style",serif;background:#f9f9f9;color:#111;max-width:1000px;margin:0 auto;padding:40px 20px}h1{color:#003366;border-bottom:1px solid #ccc;padding-bottom:5px}a{color:#003366;text-decoration:none}a:hover{text-decoration:underline}nav{text-align:center;margin-top:30px}nav a{margin:0 10px;font-weight:bold}hr{margin:30px 0}</style></head><body><nav><a href="/">Home</a> | <a href="/research01.html">Publications</a> | <a href="/research02.html">Working Papers</a> | <a href="/teaching.html">Teaching</a> | <a href="/master.html">Master in Finance</a> | <a href="/events.html">Events</a> | <a href="/professional.html">Professional</a></nav><hr><h1>Page not found</h1><p>The requested page is not available.</p><p><a href="/">Return to the homepage</a></p></body></html>
          HTML
      - name: Commit repairs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Audit and repair site; add favicon' || exit 0
          git push
