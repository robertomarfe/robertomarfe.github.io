name: SEO and web asset upgrade

on:
  push:
    paths:
      - '.github/workflows/seo-assets-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image codecs
        run: python3 -m pip install --disable-pip-version-check pillow pillow-avif-plugin

      - name: Apply upgrade
        run: python3 scripts/seo_assets_upgrade.py

      - name: Commit upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement SEO metadata publication links and web assets'
          git push
