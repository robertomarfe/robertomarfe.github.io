name: SEO and web asset upgrade

on:
  push:
    paths:
      - '.github/workflows/seo-assets-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image codecs
        run: python3 -m pip install --disable-pip-version-check pillow pillow-avif-plugin

      - name: Apply SEO metadata, publication links, and optimized assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          from PIL import Image, ImageDraw, ImageFont
          import pillow_avif

          ROOT = Path('.')
          SITE = 'https://robertomarfe.github.io'
          OG_IMAGE = SITE + '/pictures/marfe_cca_02-560.jpg'

          pages = {
              'index.html': (
                  'Roberto Marfè - Home',
                  'Academic website of Roberto Marfè, Chair of Finance at Collegio Carlo Alberto and Full Professor at the University of Turin. Research in asset pricing, macro-finance, financial economics, and mathematical finance.',
                  '/', 'profile'
              ),
              'research01.html': (
                  'Publications - Roberto Marfè',
                  'Published research by Roberto Marfè in financial economics and financial mathematics, including equity term structures, macroeconomic tail risk, learning, asset pricing, and Lévy processes.',
                  '/research01.html', 'website'
              ),
              'research02.html': (
                  'Working Papers - Roberto Marfè',
                  'Current working papers by Roberto Marfè on asset pricing, equity term structures, macro-finance, transition risk, corporate policies, expectations, and financial economics.',
                  '/research02.html', 'website'
              ),
              'teaching.html': (
                  'Teaching - Roberto Marfè',
                  'Teaching activities of Roberto Marfè at the University of Turin and Collegio Carlo Alberto, including asset pricing, derivatives, financial economics, and MAFIRM courses.',
                  '/teaching.html', 'website'
              ),
              'master.html': (
                  'Master in Finance - Roberto Marfè',
                  'Information on MAFIRM, the Master in Finance, Insurance, and Risk Management directed by Roberto Marfè at the University of Turin and Collegio Carlo Alberto.',
                  '/master.html', 'website'
              ),
              'events.html': (
                  'Events - Roberto Marfè',
                  'Academic conferences, workshops, and research events organized or co-organized by Roberto Marfè, including the LTI Asset Pricing Conference series in Turin.',
                  '/events.html', 'website'
              ),
              'professional.html': (
                  'Professional Activities - Roberto Marfè',
                  'Professional engagement, academic advisory, consulting, project evaluation, and executive training activities of Roberto Marfè in finance and risk management.',
                  '/professional.html', 'website'
              ),
              'teaching/teaching.html': (
                  'Historical Teaching Archive - Roberto Marfè',
                  'Historical archive of teaching and academic service activities by Roberto Marfè, including courses in finance, asset pricing, econometrics, and fixed income.',
                  '/teaching/teaching.html', 'website'
              ),
              'APConference/apconference.htm': (
                  'Asset Pricing Conference 2018 - Roberto Marfè',
                  'Archive of the 2018 Asset Pricing Conference organized in Turin by Long-Term Investors at the University of Turin and Collegio Carlo Alberto.',
                  '/APConference/apconference.htm', 'website'
              ),
              'Mafirm/slideshow.html': (
                  'MAFIRM Presentation - Roberto Marfè',
                  'Video and slide presentation of MAFIRM, the Master in Finance, Insurance, and Risk Management at the University of Turin and Collegio Carlo Alberto.',
                  '/Mafirm/slideshow.html', 'website'
              ),
          }

          def meta_block(title, desc, path, og_type):
              url = SITE + path
              return f'''<!-- site-meta:start -->
  <meta name="description" content="{desc}">
  <link rel="canonical" href="{url}">
  <meta property="og:locale" content="en_US">
  <meta property="og:type" content="{og_type}">
  <meta property="og:site_name" content="Roberto Marfè">
  <meta property="og:title" content="{title}">
  <meta property="og:description" content="{desc}">
  <meta property="og:url" content="{url}">
  <meta property="og:image" content="{OG_IMAGE}">
  <meta property="og:image:alt" content="Portrait of Roberto Marfè">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{title}">
  <meta name="twitter:description" content="{desc}">
  <meta name="twitter:image" content="{OG_IMAGE}">
  <meta name="theme-color" content="#003366">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
<!-- site-meta:end -->'''

          for filename, (title, desc, path, og_type) in pages.items():
              p = ROOT / filename
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              block = meta_block(title, desc, path, og_type)
              text = re.sub(r'\n?\s*<!-- site-meta:start -->.*?<!-- site-meta:end -->\s*', '\n' + block + '\n', text, flags=re.S)
              if '<!-- site-meta:start -->' not in text:
                  m = re.search(r'(\s*<title>.*?</title>)', text, flags=re.S|re.I)
                  if not m:
                      raise RuntimeError(f'No title found in {filename}')
                  text = text[:m.end()] + '\n' + block + text[m.end():]
              p.write_text(text, encoding='utf-8')

          # 404: no indexing, but keep common icon/manifest integration.
          p404 = ROOT / '404.html'
          if p404.exists():
              text = p404.read_text(encoding='utf-8')
              block = '''<!-- site-meta:start -->
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#003366">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
<!-- site-meta:end -->'''
              text = re.sub(r'\n?\s*<!-- site-meta:start -->.*?<!-- site-meta:end -->\s*', '\n' + block + '\n', text, flags=re.S)
              if '<!-- site-meta:start -->' not in text:
                  m = re.search(r'(\s*<title>.*?</title>)', text, flags=re.S|re.I)
                  if m:
                      text = text[:m.end()] + '\n' + block + text[m.end():]
              p404.write_text(text, encoding='utf-8')

          # Academic Person + WebSite structured data on the home page.
          home = ROOT / 'index.html'
          text = home.read_text(encoding='utf-8')
          structured = {
              '@context': 'https://schema.org',
              '@graph': [
                  {
                      '@type': 'WebSite',
                      '@id': SITE + '/#website',
                      'url': SITE + '/',
                      'name': 'Roberto Marfè',
                      'description': pages['index.html'][1],
                      'inLanguage': 'en',
                      'publisher': {'@id': SITE + '/#person'}
                  },
                  {
                      '@type': 'Person',
                      '@id': SITE + '/#person',
                      'name': 'Roberto Marfè',
                      'givenName': 'Roberto',
                      'familyName': 'Marfè',
                      'url': SITE + '/',
                      'image': OG_IMAGE,
                      'email': ['mailto:roberto.marfe@carloalberto.org', 'mailto:roberto.marfe@unito.it'],
                      'jobTitle': [
                          'Chair of Finance',
                          'Full Professor of Mathematical Methods in Economics, Finance and Actuarial Science'
                      ],
                      'worksFor': [
                          {'@type': 'Organization', 'name': 'Collegio Carlo Alberto', 'url': 'https://www.carloalberto.org/'},
                          {'@type': 'CollegeOrUniversity', 'name': 'University of Turin', 'url': 'https://www.unito.it/'}
                      ],
                      'affiliation': [
                          {'@type': 'Organization', 'name': 'Collegio Carlo Alberto', 'url': 'https://www.carloalberto.org/'},
                          {'@type': 'CollegeOrUniversity', 'name': 'University of Turin', 'url': 'https://www.unito.it/'}
                      ],
                      'sameAs': [
                          'https://www.carloalberto.org/person/roberto-marfe/',
                          'https://www.esomas.unito.it/do/docenti.pl/Show?_id=rmarfe#tab-profilo',
                          'https://orcid.org/0000-0002-4964-8890'
                      ],
                      'knowsAbout': [
                          'Asset pricing', 'Macro-finance', 'Financial economics',
                          'Equity term structures', 'Mathematical finance'
                      ]
                  }
              ]
          }
          jsonld = '<!-- structured-data:start -->\n<script type="application/ld+json">\n' + json.dumps(structured, ensure_ascii=False, indent=2) + '\n</script>\n<!-- structured-data:end -->'
          text = re.sub(r'\n?\s*<!-- structured-data:start -->.*?<!-- structured-data:end -->\s*', '\n' + jsonld + '\n', text, flags=re.S)
          if '<!-- structured-data:start -->' not in text:
              text = text.replace('</head>', jsonld + '\n</head>', 1)

          # Replace the displayed home portrait with AVIF/WebP/JPEG picture sources.
          old_img = '<img src="pictures/marfe_cca_02.jpg" alt="Photo of Roberto Marfè">'
          new_img = '''<picture>
      <source srcset="pictures/marfe_cca_02-560.avif" type="image/avif">
      <source srcset="pictures/marfe_cca_02-560.webp" type="image/webp">
      <img src="pictures/marfe_cca_02-560.jpg" alt="Photo of Roberto Marfè" width="280" height="280" decoding="async" fetchpriority="high">
    </picture>'''
          if old_img not in text and 'marfe_cca_02-560.avif' not in text:
              raise RuntimeError('Expected home portrait markup not found')
          text = text.replace(old_img, new_img)
          home.write_text(text, encoding='utf-8')

          # Official publication title and standardized PDF / Journal page / DOI links.
          pub = ROOT / 'research01.html'
          text = pub.read_text(encoding='utf-8')
          text = text.replace(
              'The Term Structures of Value and Growth Risk Premia – <em>Management Science</em>, 2026',
              'Value Premium and Equity Term Structures of Value and Growth Firms – <em>Management Science</em>, 2026'
          )

          replacements = {
              '<p><a href="/HKM3_MS3.pdf">Download PDF</a></p></details>':
                  '<p><a href="/HKM3_MS3.pdf">PDF</a> · <a href="https://pubsonline.informs.org/doi/10.1287/mnsc.2024.05922" target="_blank" rel="noopener noreferrer">Journal page</a> · <a href="https://doi.org/10.1287/mnsc.2024.05922" target="_blank" rel="noopener noreferrer">DOI</a></p></details>',
              '<p><a href="https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2773874">Download PDF</a></p></details>':
                  '<p><a href="https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2773874" target="_blank" rel="noopener noreferrer">SSRN</a> · <a href="https://www.sciencedirect.com/science/article/pii/S0304405X24000618" target="_blank" rel="noopener noreferrer">Journal page</a> · <a href="https://doi.org/10.1016/j.jfineco.2024.103838" target="_blank" rel="noopener noreferrer">DOI</a></p></details>',
              '<p><a href="/papers/HKM_paper.pdf">Download PDF</a></p></details>':
                  '<p><a href="/papers/HKM_paper.pdf">PDF</a> · <a href="https://www.sciencedirect.com/science/article/pii/S0304405X18303209" target="_blank" rel="noopener noreferrer">Journal page</a> · <a href="https://doi.org/10.1016/j.jfineco.2018.11.011" target="_blank" rel="noopener noreferrer">DOI</a></p></details>',
              '<p><a href="/papers/JMP_webpage.pdf">Download PDF</a></p>\n<p><a href="/papers/JMP_Slides_2016.pdf">Download Slides</a></p>':
                  '<p><a href="/papers/JMP_webpage.pdf">PDF</a> · <a href="/papers/JMP_Slides_2016.pdf">Slides</a> · <a href="https://onlinelibrary.wiley.com/doi/10.1111/jofi.12508" target="_blank" rel="noopener noreferrer">Journal page</a> · <a href="https://doi.org/10.1111/jofi.12508" target="_blank" rel="noopener noreferrer">DOI</a></p>',
              '<p><a href="/papers/HM.pdf">Download PDF</a></p>\n<p><a href="/papers/HM_Slides_EFA2015.pdf">Download Slides</a></p>':
                  '<p><a href="/papers/HM.pdf">PDF</a> · <a href="/papers/HM_Slides_EFA2015.pdf">Slides</a> · <a href="https://www.sciencedirect.com/science/article/pii/S0304405X16301040" target="_blank" rel="noopener noreferrer">Journal page</a> · <a href="https://doi.org/10.1016/j.jfineco.2015.11.002" target="_blank" rel="noopener noreferrer">DOI</a></p>',
              '<p><a href="/papers/litse_paper.pdf">Download PDF</a></p></details>':
                  '<p><a href="/papers/litse_paper.pdf">PDF</a> · <a href="https://academic.oup.com/rof/article-abstract/20/2/855/2461371" target="_blank" rel="noopener noreferrer">Journal page</a> · <a href="https://doi.org/10.1093/rof/rfv019" target="_blank" rel="noopener noreferrer">DOI</a></p></details>',
              '<p><a href="https://www.sciencedirect.com/science/article/pii/S0378426624001717">Download PDF</a></p></details>':
                  '<p><a href="https://www.sciencedirect.com/science/article/pii/S0378426624001717" target="_blank" rel="noopener noreferrer">Journal page</a> · <a href="https://doi.org/10.1016/j.jbankfin.2024.107257" target="_blank" rel="noopener noreferrer">DOI</a></p></details>',
              '<p><a href="https://www.sciencedirect.com/science/article/pii/S1544612319306324">Download PDF</a></p></details>':
                  '<p><a href="https://www.sciencedirect.com/science/article/pii/S1544612319306324" target="_blank" rel="noopener noreferrer">Journal page</a> · <a href="https://doi.org/10.1016/j.frl.2019.101336" target="_blank" rel="noopener noreferrer">DOI</a></p></details>',
              '<p><a href="https://www.tandfonline.com/doi/abs/10.1080/14697688.2011.606822">Download PDF</a></p></details>':
                  '<p><a href="https://www.tandfonline.com/doi/full/10.1080/14697688.2011.606822" target="_blank" rel="noopener noreferrer">Journal page</a> · <a href="https://doi.org/10.1080/14697688.2011.606822" target="_blank" rel="noopener noreferrer">DOI</a></p></details>',
              '<p><a href="https://www.worldscientific.com/doi/abs/10.1142/S0219024912500288">Download PDF</a></p></details>':
                  '<p><a href="https://www.worldscientific.com/doi/abs/10.1142/S0219024912500288" target="_blank" rel="noopener noreferrer">Journal page</a> · <a href="https://doi.org/10.1142/S0219024912500288" target="_blank" rel="noopener noreferrer">DOI</a></p></details>',
              '<p><a href="https://www.tandfonline.com/doi/abs/10.1080/14697688.2010.505199">Download PDF</a></p></details>':
                  '<p><a href="https://www.tandfonline.com/doi/full/10.1080/14697688.2010.505199" target="_blank" rel="noopener noreferrer">Journal page</a> · <a href="https://doi.org/10.1080/14697688.2010.505199" target="_blank" rel="noopener noreferrer">DOI</a></p></details>',
              '<p><a href="https://link.springer.com/chapter/10.1007/978-88-470-2342-0_32">Download PDF</a></p></details>':
                  '<p><a href="https://link.springer.com/chapter/10.1007/978-88-470-2342-0_32" target="_blank" rel="noopener noreferrer">Publisher page</a> · <a href="https://doi.org/10.1007/978-88-470-2342-0_32" target="_blank" rel="noopener noreferrer">DOI</a></p></details>',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
              elif new not in text:
                  raise RuntimeError('Publication link block not found: ' + old[:80])
          pub.write_text(text, encoding='utf-8')

          # Fix one malformed CSS comment encountered in the touched Professional page.
          prof = ROOT / 'professional.html'
          text = prof.read_text(encoding='utf-8')
          text = text.replace('<!--      color: #222; -->', '/* color: #222; */')
          prof.write_text(text, encoding='utf-8')

          # Optimize the home portrait while retaining the original JPEG as an archival source.
          src = ROOT / 'pictures/marfe_cca_02.jpg'
          if not src.exists():
              raise RuntimeError('Original portrait not found')
          with Image.open(src) as im:
              im = im.convert('RGB')
              # Match the existing 280 x 280 rendered geometry at 2x density.
              im = im.resize((560, 560), Image.Resampling.LANCZOS)
              im.save(ROOT / 'pictures/marfe_cca_02-560.jpg', 'JPEG', quality=88, optimize=True, progressive=True)
              im.save(ROOT / 'pictures/marfe_cca_02-560.webp', 'WEBP', quality=82, method=6)
              im.save(ROOT / 'pictures/marfe_cca_02-560.avif', 'AVIF', quality=58)

          # Apple touch icon and manifest PNG icons, matching the RM favicon design.
          def make_icon(size, output):
              canvas = Image.new('RGB', (size, size), '#003366')
              draw = ImageDraw.Draw(canvas)
              font_path = '/usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf'
              font = ImageFont.truetype(font_path, int(size * 0.40))
              bbox = draw.textbbox((0, 0), 'RM', font=font)
              w = bbox[2] - bbox[0]
              h = bbox[3] - bbox[1]
              draw.text(((size-w)/2, (size-h)/2 - bbox[1]), 'RM', font=font, fill='white')
              canvas.save(ROOT / output, 'PNG', optimize=True)

          make_icon(180, 'apple-touch-icon.png')
          make_icon(192, 'icon-192.png')
          make_icon(512, 'icon-512.png')

          manifest = {
              'name': 'Roberto Marfè — Academic Website',
              'short_name': 'Roberto Marfè',
              'description': pages['index.html'][1],
              'start_url': '/',
              'scope': '/',
              'display': 'standalone',
              'background_color': '#f9f9f9',
              'theme_color': '#003366',
              'icons': [
                  {'src': '/icon-192.png', 'sizes': '192x192', 'type': 'image/png'},
                  {'src': '/icon-512.png', 'sizes': '512x512', 'type': 'image/png'},
                  {'src': '/favicon.svg', 'sizes': 'any', 'type': 'image/svg+xml'}
              ]
          }
          (ROOT / 'site.webmanifest').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement SEO metadata publication links and web assets'
          git push
