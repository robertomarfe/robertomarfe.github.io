name: Legacy Altervista mirror

on:
  push:
    paths:
      - '.github/workflows/legacy-mirror.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mirror original pages and requisites
        shell: bash
        run: |
          set -u
          rm -rf legacy-original
          mkdir -p legacy-original logs
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36'
          pages=(
            '/'
            '/research01.html'
            '/research02.html'
            '/teaching.html'
            '/master.html'
            '/teaching/teaching.html'
            '/APConference/apconference.htm'
            '/cv/ROBERTO_MARFE_CV.pdf'
            '/pictures/marfe_cca_02.jpg'
          )

          for path in "${pages[@]}"; do
            echo "===== ${path} =====" | tee -a logs/wget.log
            ok=0
            for scheme in https http; do
              url="${scheme}://robertomarfe.altervista.org${path}"
              echo "Trying ${url}" | tee -a logs/wget.log
              if wget \
                --user-agent="$UA" \
                --timeout=30 \
                --tries=4 \
                --waitretry=3 \
                --retry-connrefused \
                --page-requisites \
                --domains=robertomarfe.altervista.org,www.robertomarfe.altervista.org \
                --no-host-directories \
                --directory-prefix=legacy-original \
                --server-response \
                "$url" >> logs/wget.log 2>&1; then
                ok=1
                break
              fi
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "FAILED ${path}" | tee -a logs/wget.log
            fi
          done

          find legacy-original -type f -printf '%P\t%s bytes\n' | sort > legacy-original/RECOVERED_FILES.txt
          cp logs/wget.log legacy-original/RECOVERY_LOG.txt

      - name: Commit recovered source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add legacy-original
          if git diff --cached --quiet; then
            echo 'No recovered-file changes to commit.'
          else
            git commit -m 'Recover original Altervista site source'
            git push
          fi

      - name: Upload recovered legacy snapshot
        uses: actions/upload-artifact@v4
        with:
          name: legacy-altervista-snapshot
          path: legacy-original
          if-no-files-found: error
          retention-days: 7
