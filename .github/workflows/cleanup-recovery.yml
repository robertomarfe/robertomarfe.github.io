name: Cleanup recovery archive
on:
  push:
    paths: ['.github/workflows/cleanup-recovery.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove recovery-only duplicates
        shell: bash
        run: |
          set -euo pipefail
          rm -rf legacy-original
          rm -f migration-audit.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary recovery archive and stale audit artifact' || exit 0
          git push
