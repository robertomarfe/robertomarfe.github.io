name: Repair and harden original site

on:
  push:
    paths:
      - '.github/workflows/site-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Recover referenced legacy teaching pages
        shell: bash
        run: |
          set -u
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36'
          targets=(
            '/teaching/assetpricing2020/fineco/'
            '/teaching/assetpricing2020/aap/'
            '/teaching/econometrics2015/'
            '/teaching/econometrics2014/'
            '/teaching/econometrics2013/'
            '/teaching/econometrics2013/syllabus_econometrics.pdf'
            '/teaching/ficr20122013/'
            '/teaching/ficr20112012/'
            '/teaching/ficr20102011/'
            '/teaching/ficr20092010/'
          )
          for path in "${targets[@]}"; do
            for scheme in https http; do
              url="${scheme}://robertomarfe.altervista.org${path}"
              if wget --user-agent="$UA" --timeout=20 --tries=2 --page-requisites \
                --domains=robertomarfe.altervista.org,www.robertomarfe.altervista.org \
                --no-host-directories --directory-prefix=. "$url" >/dev/null 2>&1; then
                echo "Recovered $path"
                break
              fi
            done
          done

      - name: Apply technical repairs and favicon
        shell: bash
        run: |
          set -euo pipefail
          cat > favicon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
            <rect width="64" height="64" rx="12" fill="#003366"/>
            <text x="32" y="41" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#ffffff">RM</text>
          </svg>
          SVG

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          files = [p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.html','.htm'} and 'legacy-original' not in p.parts and '.git' not in p.parts]
          favicon = '<link rel="icon" href="/favicon.svg" type="image/svg+xml">'
          viewport = '<meta name="viewport" content="width=device-width, initial-scale=1">'

          for p in files:
              s = p.read_text(encoding='utf-8', errors='replace')
              # Modern parsing metadata without changing visual presentation.
              if '<meta name="viewport"' not in s.lower():
                  m = re.search(r'(<meta[^>]+charset[^>]*>)', s, re.I)
                  if m:
                      s = s[:m.end()] + '\n' + viewport + s[m.end():]
                  else:
                      s = re.sub(r'(<head[^>]*>)', r'\1\n' + viewport, s, count=1, flags=re.I)
              # Remove stale icon references then add one root-relative icon.
              s = re.sub(r'\s*<link[^>]+rel=["\'][^"\']*(?:shortcut\s+icon|icon)[^"\']*["\'][^>]*>', '', s, flags=re.I)
              s = re.sub(r'(</title>)', r'\1\n  ' + favicon, s, count=1, flags=re.I)
              # Protect tabs opened in a new browsing context.
              def secure_blank(m):
                  tag = m.group(0)
                  if re.search(r'\brel\s*=', tag, re.I):
                      return tag
                  return tag[:-1] + ' rel="noopener noreferrer">'
              s = re.sub(r'<a\b[^>]*\btarget=["\']_blank["\'][^>]*>', secure_blank, s, flags=re.I)
              p.write_text(s, encoding='utf-8')

          # Concrete markup/CSS defects.
          p = Path('professional.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<h1>Professional Engagement and Consulting</h2>', '<h1>Professional Engagement and Consulting</h1>')
          p.write_text(s, encoding='utf-8')

          p = Path('master.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<!-- text-decoration: underline; -->', '/* text-decoration: underline; */')
          p.write_text(s, encoding='utf-8')

          p = Path('Mafirm/slideshow.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('href="http://robertomarfe.altervista.org"', 'href="/"')
          for n in range(2,14):
              s = s.replace(f'id="slide{n}" class="slide active"', f'id="slide{n}" class="slide"')
          p.write_text(s, encoding='utf-8')

          p = Path('research02.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\s*<p><a href="">Download PDF</a></p>', '', s)
          p.write_text(s, encoding='utf-8')

          p = Path('events.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<a href="#">[]</a>', '')
          p.write_text(s, encoding='utf-8')

          p = Path('APConference/apconference.htm')
          s = p.read_text(encoding='utf-8')
          # Stray closing brace made the legacy popup script syntactically invalid.
          s = s.replace('  window.open(apri,"","width=" + w + ",height=" + h + ",top=" + t + ",left=" + l);\n}\n}\n</script>', '  window.open(apri,"","width=" + w + ",height=" + h + ",top=" + t + ",left=" + l);\n}\n</script>')
          p.write_text(s, encoding='utf-8')
          PY

          # Remove obsolete files left by the discarded redesign.
          rm -rf assets
          rm -f cv/index.html

          # Remove one-shot migration workflows; keep audit/smoke-test workflows.
          rm -f .github/workflows/legacy-mirror.yml .github/workflows/deploy-recovered-original.yml

      - name: Refresh sitemap and smoke test
        shell: bash
        run: |
          cat > sitemap.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url><loc>https://robertomarfe.github.io/</loc></url>
            <url><loc>https://robertomarfe.github.io/research01.html</loc></url>
            <url><loc>https://robertomarfe.github.io/research02.html</loc></url>
            <url><loc>https://robertomarfe.github.io/teaching.html</loc></url>
            <url><loc>https://robertomarfe.github.io/master.html</loc></url>
            <url><loc>https://robertomarfe.github.io/events.html</loc></url>
            <url><loc>https://robertomarfe.github.io/professional.html</loc></url>
            <url><loc>https://robertomarfe.github.io/Mafirm/slideshow.html</loc></url>
            <url><loc>https://robertomarfe.github.io/teaching/teaching.html</loc></url>
            <url><loc>https://robertomarfe.github.io/APConference/apconference.htm</loc></url>
          </urlset>
          XML

          cat > 404.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Page not found - Roberto Marfè</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><style>body{font-family:"Bookman Old Style",serif;background:#f9f9f9;color:#111;max-width:1000px;margin:0 auto;padding:40px 20px}h1{color:#003366;border-bottom:1px solid #ccc;padding-bottom:5px}a{color:#003366;text-decoration:none}a:hover{text-decoration:underline}nav{text-align:center;margin-top:30px}nav a{margin:0 10px;font-weight:bold}hr{margin:30px 0}</style></head><body><nav><a href="/">Home</a> | <a href="/research01.html">Publications</a> | <a href="/research02.html">Working Papers</a> | <a href="/teaching.html">Teaching</a> | <a href="/master.html">Master in Finance</a> | <a href="/events.html">Events</a> | <a href="/professional.html">Professional</a></nav><hr><h1>Page not found</h1><p>The requested page is not available.</p><p><a href="/">Return to the homepage</a></p></body></html>
          HTML

          cat > .github/workflows/site-smoke-test.yml <<'YAML'
          name: Site smoke test
          on:
            workflow_run:
              workflows: ["pages build and deployment"]
              types: [completed]
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            smoke-test:
              if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
              runs-on: ubuntu-latest
              steps:
                - name: Verify public HTTPS routes
                  shell: bash
                  run: |
                    set -euo pipefail
                    base="https://robertomarfe.github.io"
                    routes=("/" "/research01.html" "/research02.html" "/teaching.html" "/master.html" "/events.html" "/professional.html" "/Mafirm/slideshow.html" "/cv/ROBERTO_MARFE_CV.pdf")
                    for route in "${routes[@]}"; do
                      code=$(curl --proto '=https' --tlsv1.2 -L -sS -o /tmp/page -w '%{http_code}' "${base}${route}")
                      test "$code" = "200" || { echo "${route}: HTTP ${code}"; exit 1; }
                    done
                    echo 'All primary routes returned HTTP 200 over HTTPS.'
          YAML

      - name: Commit repairs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Audit and repair original site; add favicon' || exit 0
          git push
