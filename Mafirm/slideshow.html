  <style>
    body {

    }

    }
    audio {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: 40%;
      max-width: 400px;
    }
#external-button {
  position: fixed;
  bottom: 25px; /* sopra l'audio */

  transform: scale(1.05);

  </style>

<body>

<a href="/"  id="external-button">
  Homepage
</a>


<!-- Audio -->
<audio id="audio" src="audio/MAFIRM_12m.mp3" controls autoplay></audio>

<!-- Slides with images -->
<div id="slide1" class="slide active">
  <img src="slides/slide_01.png" alt="Slide 1">

<div id="slide5" class="slide">

<div id="slide6" class="slide">

<div id="slide12" class="slide">

</div>

<div id="slide13" class="slide">
  <img src="slides/slide_13.png" alt="Slide 13">
</div>

<!-- JavaScript -->
<script>
  const slides = [
    { time: 0, id: 'slide1' },
    { time: 50, id: 'slide2' },
    { time: 154, id: 'slide3' },
    { time: 203, id: 'slide5' },
    { time: 250, id: 'slide4' },
    { time: 315, id: 'slide6' },
    { time: 380, id: 'slide7' },
    { time: 458, id: 'slide8' },
    { time: 520, id: 'slide9' },
    { time: 550, id: 'slide10' },
    { time: 594, id: 'slide11' },
    { time: 631, id: 'slide12' },
    { time: 675, id: 'slide13' }
  ];

  const audio = document.getElementById('audio');

  function updateSlide(currentTime) {
    let activeIndex = 0;

    for (let i = 0; i < slides.length; i++) {
      if (currentTime >= slides[i].time) {
        activeIndex = i;
      } else {
        break;
      }
    }

    slides.forEach((slide, index) => {
      const el = document.getElementById(slide.id);
      if (index === activeIndex) {
        el.classList.add('active');
      } else {
        el.classList.remove('active');
      }
    });
  }

  audio.ontimeupdate = () => {
    updateSlide(audio.currentTime);
  };


</script>

</body>
